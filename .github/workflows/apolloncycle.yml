name: Apollon — cycle (auto-réparant)

# Ce workflow commence par NETTOYER le dépôt avant de faire quoi que ce soit.
#
# Pourquoi : les navigateurs renomment « fichier.py » en « fichier (1).py »
# quand une copie existe déjà dans les téléchargements. Le dépôt se retrouve
# avec des doublons, et deux workflows qui tournent en parallèle.
#
# Plutôt que d'exiger de l'utilisateur qu'il renomme à la main, l'étape 0
# le fait elle-même : le fichier « (n) » le plus récent gagne, l'ancien est
# écrasé, et les workflows en double sont supprimés.

on:
  schedule:
    - cron: "12 5 * * 1-5"
    - cron: "47 19 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # =============================================================
      # 0. AUTO-RÉPARATION — avant tout le reste.
      # =============================================================
      - name: 0 · Auto-réparation
        run: |
          set +e
          git config user.name  "Apollon"
          git config user.email "apollon@users.noreply.github.com"

          # ---------------------------------------------------------------
          # LIMITE GITHUB, NON CONTOURNABLE (E-061).
          #
          # Le GITHUB_TOKEN d'Actions ne peut JAMAIS écrire dans
          # .github/workflows/ :
          #   « refusing to allow a GitHub App to create or update workflow
          #     ... without `workflows` permission »
          # Ce scope n'existe pas pour ce jeton — ce n'est pas une permission
          # à ajouter, c'est une interdiction de plateforme.
          #
          # La première version stageait TOUT. Un seul doublon de workflow
          # faisait rejeter le push ENTIER, et les renommages des fichiers
          # Python étaient perdus avec lui. Un nettoyage qui échoue en bloc
          # sur ce qu'il n'a pas le droit de toucher n'est pas un nettoyage.
          #
          # Désormais : on répare TOUT dans l'arbre de travail (le cycle
          # courant utilise donc les bons fichiers), et on ne COMMITE que
          # ce qui est committable.
          # ---------------------------------------------------------------

          # Les doublons SOUS .github/workflows/ sont relevés AVANT le
          # renommage : celui-ci les consomme dans l'arbre local, mais le
          # dépôt les conserve — le commit n'a pas le droit d'y toucher.
          # Sans ce relevé, deux workflows repartiraient au cycle suivant
          # sans que rien ne le signale.
          A_SUPPRIMER=""
          for F in .github/workflows/*\ \(*\)*; do
            [ -f "$F" ] && A_SUPPRIMER="$A_SUPPRIMER|$F"
          done

          echo "— normalisation des doublons « (n) » —"
          find . -path ./.git -prune -o -type f -name '* (*)*' -print | while read -r DUP; do
            PROPRE=$(echo "$DUP" | sed -E 's/ \([0-9]+\)//')
            echo "  $DUP  ->  $PROPRE"
            mv -f "$DUP" "$PROPRE"
          done

          echo "— doublons de workflow —"
          MOI=$(echo "${{ github.workflow_ref }}" | sed -E 's#^[^/]+/[^/]+/##; s#@.*$##')
          echo "  workflow courant : ${MOI:-INDÉTERMINÉ}"
          if [ -n "$MOI" ] && [ -f "$MOI" ]; then
            for F in .github/workflows/*.yml .github/workflows/*.yaml; do
              [ -f "$F" ] || continue
              [ "$F" = "$MOI" ] && continue
              if head -5 "$F" | grep -qi '^name:.*Apollon'; then
                A_SUPPRIMER="$A_SUPPRIMER|$F"
                rm -f "$F"
              fi
            done
          else
            echo "::warning::workflow courant non résolu — doublons non examinés"
          fi

          echo "— commit (workflows EXCLUS : interdiction de plateforme) —"
          git add -A -- . ':(exclude).github/workflows'
          if git diff --staged --quiet; then
            echo "  rien à committer hors workflows."
          else
            git commit -q -m "auto-réparation : doublons normalisés"
            git pull --rebase --autostash -q || true
            if git push -q; then
              echo "  poussé."
            else
              echo "::warning::push refusé — le cycle continue sur l'arbre local réparé"
            fi
          fi

          # Ce que la machine ne PEUT PAS faire, elle le dit précisément.
          if [ -n "$A_SUPPRIMER" ]; then
            echo ""
            echo "::error::ACTION MANUELLE REQUISE — doublons de workflow"
            echo "$A_SUPPRIMER" | tr '|' '\n' | while read -r F; do
              [ -n "$F" ] && echo "::error::  supprimez « $F » sur github.com (menu ... > Delete file)"
            done
            echo "::error::Tant qu'ils existent, DEUX cycles tournent en parallèle."
            echo "::error::Le jeton d'Actions n'a pas le droit d'y toucher."
          fi
          exit 0

      # =============================================================
      # 0b. INVENTAIRE — dire ce qui manque, en clair, avant d'échouer.
      # =============================================================
      - name: 0b · Inventaire des fichiers requis
        working-directory: apollon-repo/pipeline
        run: |
          MANQUE=0
          for F in apollon_data.py apollon_macro.py apollon_quant.py \
                   apollon_risque.py apollon_trading.py quant_v3.py \
                   test_macro.py test_veto.py test_collecte.py \
                   simulateur_fred.py; do
            if [ -f "$F" ]; then
              printf '  OK      %-24s %5s lignes\n' "$F" "$(wc -l < "$F")"
            else
              printf '  ABSENT  %-24s\n' "$F"
              MANQUE=$((MANQUE+1))
            fi
          done
          echo "fichiers manquants : $MANQUE"
          if [ "$MANQUE" -gt 0 ]; then
            echo "::warning::$MANQUE fichier(s) absent(s) — les sections correspondantes seront sautées"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet requests pandas numpy scipy

      # =============================================================
      # 1. COLLECTE
      # =============================================================
      - name: 1 · Collecte FRED (millésimes + calendrier)
        id: collecte
        continue-on-error: true
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        working-directory: apollon-repo/pipeline
        run: python3 apollon_data.py --history 10 --factors --vintage

      - name: 1b · Facteurs Fama-French à l'emplacement attendu
        working-directory: apollon-repo/pipeline
        run: |
          mkdir -p data
          if [ -f data/fama_french_5_daily.csv ]; then
            echo "facteurs déjà dans data/"
          elif [ -f ../../data/fama_french_5_daily.csv ]; then
            cp ../../data/fama_french_5_daily.csv data/
            echo "facteurs copiés depuis la racine"
          else
            echo "::warning::facteurs absents — le banc quantitatif se declarera NON ETALONNE"
          fi

      # =============================================================
      # 2. BANCS DE TEST — un banc rouge doit se voir, mais ne doit plus
      #    empêcher les moteurs de tourner : leur verdict reste lisible,
      #    et l'étape 4 refuse de déclarer le cycle valide.
      # =============================================================
      - name: 2 · Bancs de test (normal et -O)
        id: bancs
        continue-on-error: true
        working-directory: apollon-repo/pipeline
        run: |
          ECHEC=0
          for T in test_macro.py test_veto.py test_collecte.py; do
            [ -f "$T" ] || { echo "::warning::$T absent"; continue; }
            for MODE in "" "-O"; do
              if python3 $MODE "$T" > /tmp/out.txt 2>&1; then
                echo "  OK   python3 $MODE $T"
              else
                echo "  KO   python3 $MODE $T"
                tail -20 /tmp/out.txt
                ECHEC=1
              fi
            done
          done
          exit $ECHEC

      # =============================================================
      # 3. LES QUATRE SECTIONS
      # =============================================================
      - name: 3a · Section Macro
        id: macro
        continue-on-error: true
        working-directory: apollon-repo/pipeline
        run: python3 apollon_macro.py --data ./data

      - name: 3b · Section Quantitative
        id: quant
        continue-on-error: true
        working-directory: apollon-repo/pipeline
        run: |
          [ -f apollon_quant.py ] || { echo "::warning::apollon_quant.py absent — section sautée"; exit 0; }
          python3 apollon_quant.py --data ./data

      - name: 3c · Section Trading
        id: trading
        continue-on-error: true
        working-directory: apollon-repo/pipeline
        run: python3 apollon_trading.py --data ./data

      - name: 3d · Section Risque — VETO
        id: risque
        continue-on-error: true
        working-directory: apollon-repo/pipeline
        run: python3 apollon_risque.py --data ./data

      # =============================================================
      # 4. VERDICT DU CYCLE
      # =============================================================
      - name: 4 · Verdict
        run: |
          echo "collecte=${{ steps.collecte.outcome }}  bancs=${{ steps.bancs.outcome }}"
          echo "macro=${{ steps.macro.outcome }}  quant=${{ steps.quant.outcome }}"
          echo "trading=${{ steps.trading.outcome }}  risque=${{ steps.risque.outcome }}"
          echo ""
          if [ "${{ steps.collecte.outcome }}" = "failure" ]; then
            echo "::error::COLLECTE EN ÉCHEC — vérifier le secret FRED_API_KEY."
            exit 1
          fi
          if [ "${{ steps.bancs.outcome }}" = "failure" ]; then
            echo "::error::UN BANC DE TEST EST ROUGE. Les moteurs ont tourné et leurs"
            echo "::error::sorties sont en artefact, mais AUCUN verdict n'est opposable"
            echo "::error::tant que les bancs ne passent pas."
            exit 1
          fi
          if [ "${{ steps.macro.outcome }}" = "failure" ] || \
             [ "${{ steps.trading.outcome }}" = "failure" ]; then
            echo "::error::Un moteur amont a échoué — cycle invalide."
            exit 1
          fi
          echo "CYCLE VALIDE. Un code non nul en Section Risque signifie un veto"
          echo "opposé ou une source non examinable : c'est un résultat, pas une panne."

      # =============================================================
      # 5. ARCHIVAGE — toujours, même après échec.
      # =============================================================
      - name: 5 · Archiver
        if: always()
        run: |
          JOUR=$(date -u +%Y-%m-%d)
          mkdir -p data "cycles/$JOUR"
          cp -r apollon-repo/pipeline/data/* data/ 2>/dev/null || true
          cp apollon-repo/pipeline/*_resultats.json \
             apollon-repo/pipeline/veto_risque.json \
             apollon-repo/pipeline/brief_macro_*.md \
             apollon-repo/pipeline/alertes_risque.jsonl \
             apollon-repo/pipeline/registre_calibration.csv \
             apollon-repo/pipeline/data/calendrier_publications.csv \
             "cycles/$JOUR/" 2>/dev/null || true
          git config user.name  "Apollon"
          git config user.email "apollon@users.noreply.github.com"
          git add -A data/ cycles/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Aucun changement à archiver."
          else
            git commit -m "cycle du $(date -u +%Y-%m-%dT%H:%M)Z"
            git pull --rebase --autostash || true
            git push
          fi

      - name: 6 · Artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cycle-${{ github.run_number }}
          path: |
            apollon-repo/pipeline/*_resultats.json
            apollon-repo/pipeline/veto_risque.json
            apollon-repo/pipeline/brief_macro_*.md
            apollon-repo/pipeline/alertes_risque.jsonl
            apollon-repo/pipeline/data/calendrier_publications.csv
          retention-days: 30
          if-no-files-found: ignore
